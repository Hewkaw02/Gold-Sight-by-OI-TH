name: Refresh CME contract expiry series

on:
  schedule:
    - cron: "30 6 * * 1-5"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-sight-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, Windows, gold-sight]
    timeout-minutes: 30
    env:
      GOLD_SIGHT_DATA_ROOT: public/data
      GOLD_SIGHT_SYMBOL: GC
      DISPLAY_TIMEZONE: Asia/Bangkok
      CME_TIMEZONE: America/Chicago
      CME_STORAGE_STATE_PATH: runtime/cme-storage-state.json
      CME_HEADLESS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Keep the ignored CME session on the persistent self-hosted runner.
          clean: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Camoufox browser
        run: npx camoufox-js fetch

      - name: Validate or refresh CME session
        env:
          CME_EMAIL: ${{ secrets.CME_EMAIL }}
          CME_PASSWORD: ${{ secrets.CME_PASSWORD }}
        run: npm run auth:cme

      - name: Collect contract expiry series
        env:
          CME_EMAIL: ${{ secrets.CME_EMAIL }}
          CME_PASSWORD: ${{ secrets.CME_PASSWORD }}
        run: npm run collector:expiry-series

      - name: Commit normalized expiry data
        shell: pwsh
        run: |
          git config user.name "gold-sight-bot"
          git config user.email "gold-sight-bot@users.noreply.github.com"
          git add public/data
          if (git diff --cached --quiet) {
            Write-Host "No contract expiry changes."
            exit 0
          }
          git commit -m "data: refresh CME contract expiry series"
          git push origin HEAD:${{ github.ref_name }}
